name: APP CI

# Lints, type-checks, and builds the SPA. Runs on every push and PR.
# No AWS calls — the build runs against a placeholder VITE_API_BASE_URL so
# Vite never reads the real production URL during CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-build:
    name: lint + typecheck + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      # Vite inlines VITE_* values at build time. The CI build only proves
      # the source compiles end-to-end; the URL it bakes in is a placeholder
      # and any artifact uploaded here would NOT work in production. The
      # real deploy job (deploy.yml) sets the real values from secrets/vars
      # before running `npm run build` again.
      - name: Build SPA (placeholder env)
        env:
          VITE_API_BASE_URL: http://localhost:4000
          VITE_STRIPE_PUBLISHABLE_KEY: ""
        run: npm run build
